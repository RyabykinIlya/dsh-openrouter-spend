# Git hooks configuration for translation consistency and repository guards
# Managed by lefthook: https://github.com/evilmartians/lefthook

pre-commit:
  commands:
    translation-sync:
      glob: "README*.md"
      run: node scripts/verify-translation-sync.mjs
      stage_fixed: false

pre-push:
  commands:
    translation-sync:
      run: node scripts/verify-translation-sync.mjs
    repo-guard:
      run: node --test tests/repo-guard.test.mjs
